<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Droid+Arabic+Kufi&family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>Abdullah - Links</title>
    <style>
        /* ===== BASE STYLES & VARIABLES ===== */
        html[lang="ar"],
        body:lang(ar) {
            font-family: 'Droid Arabic Kufi', sans-serif;
            direction: rtl;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1d4ed8;
            --primary-deep: #1e3a8a;
            --accent: #d97706;
            --text: #111827;
            --text-muted: #6b7280;
            --text-faint: #9ca3af;
            --surface: #ffffff;
            --surface-alt: #f9fafb;
            --border: #e5e7eb;
            --border-strong: #d1d5db;
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
            --shadow-blue: 0 8px 24px rgba(29,78,216,0.2);
            --radius: 16px;
        }

        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-deep: #2563eb;
            --accent: #f59e0b;
            --text: #f9fafb;
            --text-muted: #9ca3af;
            --text-faint: #6b7280;
            --surface: #111827;
            --surface-alt: #1f2937;
            --border: #374151;
            --border-strong: #4b5563;
            --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-blue: 0 8px 24px rgba(59,130,246,0.25);
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--surface-alt);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== BACKGROUND EFFECTS ===== */
        .bg-effects {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        .bg-effects::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(29, 78, 216, 0.08) 0%, transparent 70%);
            top: -150px;
            right: -100px;
            border-radius: 50%;
        }
        [data-theme="dark"] .bg-effects::before {
            background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, transparent 70%);
        }

        /* ===== TOP CONTROLS ===== */
        .top-controls {
            display: flex;
            justify-content: flex-end;
            padding: 1.5rem;
            gap: 0.5rem;
            max-width: 680px;
            margin: 0 auto;
            width: 100%;
        }

        .control-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            color: var(--text-muted);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .control-btn:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .control-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }
        .icon-moon { display: block; } .icon-sun { display: none; }
        [data-theme="dark"] .icon-moon { display: none; } [data-theme="dark"] .icon-sun { display: block; }
        .icon-lang-en { display: block; } .icon-lang-ar { display: none; }
        [lang="ar"] .icon-lang-en { display: none; } [lang="ar"] .icon-lang-ar { display: block; }

        /* ===== MAIN CONTAINER ===== */
        .main-container {
            flex: 1;
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            padding: 0 1.5rem 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== PROFILE SECTION ===== */
        .profile-section {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: fadeInUp 0.8s ease both;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 1.25rem;
            overflow: hidden;
            box-shadow: var(--shadow-md), 0 0 0 4px var(--surface), 0 0 0 6px var(--border);
            transition: transform 0.3s ease;
        }

        .profile-image:hover { transform: scale(1.05); }

        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .profile-image-fallback {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #fff;
            font-weight: 700;
        }

        .profile-section h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
        }

        .hero-eyebrow {
            display: inline-block;
            padding: 0.3rem 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 0.05em;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        /* ===== LINKS GRID ===== */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-card {
            display: flex;
            align-items: center;
            width: 100%;
            background: var(--surface);
            padding: 1rem 1.25rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            text-decoration: none;
            color: var(--text);
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.25s ease;
            position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            animation: fadeInUp 0.8s ease both;
        }

        /* Staggered animation delays */
        .link-card:nth-child(1) { animation-delay: 0.1s; }
        .link-card:nth-child(2) { animation-delay: 0.2s; }
        .link-card:nth-child(3) { animation-delay: 0.3s; }
        .link-card:nth-child(4) { animation-delay: 0.4s; }
        .link-card:nth-child(5) { animation-delay: 0.5s; }
        .link-card:nth-child(6) { animation-delay: 0.6s; }

        .link-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
            transform: translateY(-4px);
            color: var(--primary);
        }

        .link-icon {
            width: 42px;
            height: 42px;
            background: var(--surface-alt);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-right: 1.25rem;
            transition: all 0.25s ease;
        }

        [lang="ar"] .link-icon {
            margin-right: 0;
            margin-left: 1.25rem;
        }

        .link-card:hover .link-icon {
            background: var(--primary);
            color: #fff;
        }

        .link-icon svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 1.8;
            fill: none;
            transition: stroke 0.25s;
        }
        
        .link-card:hover .link-icon svg {
            stroke: #fff;
        }

        .link-text {
            flex: 1;
            text-align: center;
            padding-right: 42px; /* Offset to keep text perfectly centered */
        }

        [lang="ar"] .link-text {
            padding-right: 0;
            padding-left: 42px;
        }

        /* Highlight main website */
        .link-card.main-link {
            background: linear-gradient(135deg, var(--primary), var(--primary-deep));
            color: #fff;
            border-color: transparent;
            box-shadow: var(--shadow-blue);
        }
        .link-card.main-link:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 28px rgba(29,78,216,0.3);
        }
        .link-card.main-link .link-icon {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }
        .link-card.main-link:hover .link-icon svg {
            stroke: #fff;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 2rem 0;
            color: var(--text-faint);
            font-size: 0.85rem;
            animation: fadeInUp 0.8s ease 0.8s both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

    <script>
        // ===== LANGUAGE =====
        let currentLang = localStorage.getItem('language') || 'en';

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            localStorage.setItem('language', currentLang);
            applyLanguage();
        }

        function applyLanguage() {
            document.documentElement.setAttribute('lang', currentLang);
            document.querySelectorAll('[data-en]').forEach(el => {
                const text = el.getAttribute('data-' + currentLang);
                if (text) {
                    el.textContent = text;
                }
            });
        }

        applyLanguage();
        document.getElementById('langToggle').addEventListener('click', toggleLanguage);

        // ===== THEME =====
        const html = document.documentElement;
        html.setAttribute('data-theme', localStorage.getItem('theme') || 'light');

        function toggleTheme() {
            const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }

        document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    </script>
